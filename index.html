<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hello PWA</title>
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Najprostsza PWA z licznikiem i lokalnym zapisem stanu." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Hello PWA 👋</h1>
      <p class="subtitle">Licznik zapisywany lokalnie na tym urządzeniu.</p>

      <output id="count" class="count" aria-live="polite">0</output>

      <div class="actions">
        <button id="dec" class="btn" type="button" aria-label="Zmniejsz wartość">−</button>
        <button id="inc" class="btn btn-primary" type="button" aria-label="Zwiększ wartość">+</button>
      </div>

      <button id="reset" class="btn-reset" type="button">Wyzeruj</button>

      <p id="status" class="status" role="status"></p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
